[package]
name = "mundane_os"
version = "0.1.0"
edition = "2024"
authors = ["Avuyile <mavu072@users.noreply.github.com>"]

[dependencies]
bootloader = "0.9"

# the profile for `cargo build`
[profile.dev]
panic = "abort" # disable stack unwinding on panic

# the profile for `cargo build --release`
[profile.release]
panic = "abort" # disable stack unwinding on panic

# tell rust-analyzer don't build this binary in test or benchmark mode
[[bin]]
name = "mundane_os"
test = false
bench = false
